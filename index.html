<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffd9e8" />
<title>쿠키런 - 웹 게임</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="game-wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <!-- ================= HUD ================= -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="score-box">
        <span class="hud-label">점수</span>
        <span id="hudScore">0</span>
      </div>
      <div class="sub-hud">
        <div class="dist-box"><b id="hudDist">0</b> m</div>
        <div class="speed-box"><b id="hudSpeed">0</b> km/h <em id="hudSpeedMul" class="hidden">×1</em></div>
      </div>
    </div>

    <div class="hud-right">
      <div class="energy-wrap">
        <div class="hud-label">에너지</div>
        <div class="energy-bar"><div id="energyFill"></div></div>
      </div>
      <button id="btn-pause" class="icon-btn" title="일시정지 (P)" aria-label="일시정지">❚❚</button>
    </div>

    <div id="comboBadge" class="combo-badge hidden">콤보 <b id="comboNum">0</b></div>

    <div class="power-chips">
      <div class="chip hidden" id="chip-magnet"><span>🧲 자석</span><i></i></div>
      <div class="chip hidden" id="chip-star"><span>⭐ 무적</span><i></i></div>
    </div>
  </div>

  <!-- ================= 시작 화면 ================= -->
  <div id="screen-menu" class="screen">
    <div class="panel menu-panel">
      <h1 class="logo"><span>쿠키</span>런</h1>
      <p class="subtitle">달콤한 질주, 어디까지 갈 수 있을까?</p>

      <div class="section-title">쿠키를 골라주세요</div>
      <div class="cookie-list" id="cookieList"></div>

      <div class="speed-head">
        <span class="section-title">속도 (난이도)</span>
        <span id="speedValue" class="speed-value">현재 ×1</span>
      </div>
      <div class="speed-list" id="speedList"></div>

      <button id="btn-start" class="btn primary big">게임 시작</button>

      <div class="keys">
        <span><kbd>Space</kbd> / <kbd>↑</kbd> 점프 (2단 점프)</span>
        <span><kbd>↓</kbd> 슬라이드</span>
        <span><kbd>−</kbd> <kbd>=</kbd> 속도 조절</span>
        <span><kbd>P</kbd> 일시정지</span>
        <span><kbd>M</kbd> 소리</span>
      </div>
      <div class="touch-hint">👆 화면 탭 = 점프 · 아래로 쓸면 슬라이드</div>
      <div class="best-line">최고 점수 <b id="menuBest">0</b></div>
    </div>
  </div>

  <!-- ================= 일시정지 ================= -->
  <div id="screen-pause" class="screen hidden">
    <div class="panel small-panel">
      <h2>잠시 쉬는 중 🍪</h2>
      <p class="muted">숨을 고르고 다시 달려볼까요?</p>
      <div class="btn-row">
        <button id="btn-resume" class="btn primary">계속하기</button>
        <button id="btn-restart-pause" class="btn">다시 시작</button>
        <button id="btn-menu-pause" class="btn ghost">캐릭터 선택</button>
      </div>
    </div>
  </div>

  <!-- ================= 게임 오버 ================= -->
  <div id="screen-over" class="screen hidden">
    <div class="panel small-panel">
      <h2 id="overTitle">쿠키가 지쳤어요!</h2>
      <div id="newRecord" class="record hidden">🎉 신기록 달성!</div>
      <div class="result-grid">
        <div class="result-item"><span>점수</span><b id="overScore">0</b></div>
        <div class="result-item"><span>달린 거리</span><b id="overDist">0 m</b></div>
        <div class="result-item"><span>모은 젤리</span><b id="overJelly">0</b></div>
        <div class="result-item"><span>최고 점수</span><b id="overBest">0</b></div>
      </div>
      <div class="btn-row">
        <button id="btn-retry" class="btn primary">다시 달리기</button>
        <button id="btn-menu-over" class="btn ghost">캐릭터 선택</button>
      </div>
    </div>
  </div>

  <!-- ================= 모바일 조작 ================= -->
  <div id="touch-controls">
    <button id="btn-slide" class="touch-btn">슬라이드</button>
    <button id="btn-jump" class="touch-btn">점프</button>
  </div>

  <button id="btn-sound" class="icon-btn sound-btn" title="소리 (M)" aria-label="소리">🔊</button>
</div>

<script src="game.js"></script>
</body>
</html>
